<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="إجازاتي" />
    <meta name="description" content="نظام متكامل لإدارة إجازات الموظفين" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <title>نظام إدارة الإجازات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <style>
      * { font-family: "Cairo", "Tajawal", sans-serif; box-sizing: border-box; }
      body { margin: 0; padding: 0; background-color: #f8fafc; overscroll-behavior: none; }
      body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
      html { scroll-behavior: smooth; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      #pwa-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: linear-gradient(135deg, #1e1b4b, #312e81, #4f46e5);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px;
        transition: opacity 0.5s ease;
      }
      #pwa-splash.hidden { opacity: 0; pointer-events: none; }
      #pwa-splash .logo {
        width: 90px; height: 90px; background: rgba(255,255,255,0.15);
        border-radius: 24px; display: flex; align-items: center; justify-content: center;
        font-size: 44px; backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.2);
        animation: pulse 1.5s ease-in-out infinite;
      }
      #pwa-splash p { color: white; font-size: 22px; font-weight: 900; margin: 0; }
      #pwa-splash small { color: rgba(255,255,255,0.6); font-size: 13px; }
      @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
      #install-banner {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
        background: linear-gradient(135deg, #1e1b4b, #4f46e5);
        color: white; padding: 16px 24px;
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
        transform: translateY(100%); transition: transform 0.4s ease;
      }
      #install-banner.show { transform: translateY(0); }
      #install-banner button { padding: 8px 20px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; font-size: 13px; }
      #install-banner .btn-install { background: white; color: #4f46e5; }
      #install-banner .btn-dismiss { background: rgba(255,255,255,0.15); color: white; }
      #offline-banner {
        position: fixed; top: 0; left: 0; right: 0; z-index: 300;
        background: #dc2626; color: white;
        padding: 10px; text-align: center; font-size: 13px; font-weight: 700;
        transform: translateY(-100%); transition: transform 0.3s ease;
      }
      #offline-banner.show { transform: translateY(0); }
    </style>
  </head>
  <body>
    <noscript>يجب عليك تفعيل JavaScript لتشغيل هذا التطبيق.</noscript>
    <div id="pwa-splash">
      <div class="logo">📅</div>
      <p>نظام إدارة الإجازات</p>
      <small>جاري التحميل...</small>
    </div>
    <div id="offline-banner">⚠️ أنت غير متصل بالإنترنت</div>
    <div id="install-banner">
      <div>
        <div style="font-weight:900;font-size:15px">📱 ثبّت التطبيق على هاتفك</div>
        <div style="font-size:12px;opacity:0.8">أضفه لشاشتك الرئيسية للوصول السريع</div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn-install" id="btn-install">تثبيت الآن</button>
        <button class="btn-dismiss" id="btn-dismiss">لاحقاً</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('pwa-splash');
          if (splash) { splash.classList.add('hidden'); setTimeout(() => splash.remove(), 500); }
        }, 1500);
      });
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW error:', err));
        });
      }
      let deferredPrompt;
      const installBanner = document.getElementById('install-banner');
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!localStorage.getItem('pwa-dismissed')) {
          setTimeout(() => installBanner.classList.add('show'), 4000);
        }
      });
      document.getElementById('btn-install')?.addEventListener('click', async () => {
        installBanner.classList.remove('show');
        if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
      });
      document.getElementById('btn-dismiss')?.addEventListener('click', () => {
        installBanner.classList.remove('show');
        localStorage.setItem('pwa-dismissed', '1');
      });
      const offlineBanner = document.getElementById('offline-banner');
      window.addEventListener('offline', () => offlineBanner.classList.add('show'));
      window.addEventListener('online', () => offlineBanner.classList.remove('show'));
      if (!navigator.onLine) offlineBanner.classList.add('show');
    </script>
  </body>
</html>
